name: Build standalone XyneriaUI

on:
  push:
    paths:
      - "src/**"
      - "vendor/WindUI/dist/main.lua"
      - "build/build.py"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python build/build.py
      - name: Verify generated file is committed
        run: git diff --exit-code dist/XyneriaUI.lua
